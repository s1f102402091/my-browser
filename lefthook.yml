# Git フックの設定 (https://lefthook.dev/)
# 登録: `mise run setup` (内部で `lefthook install` を実行)
# 一時的に飛ばしたい場合: `LEFTHOOK=0 git commit ...`

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all --check
      fail_text: "整形されていません。`mise run fmt` を実行してから再度コミットしてください。"
    - name: clippy
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: typos
      run: typos --force-exclude {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}

pre-push:
  jobs:
    - name: test
      run: cargo test --all-targets --locked

[package]
name = "my-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "「Web Browser Engineering」を参考に Rust で作る、省メモリな自作ブラウザ"
publish = false

[dependencies]
native-tls = "0.2"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# メモリ使用量を意識するため、不要なコピーを生みやすいパターンを警告する
redundant_clone = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
# デバッグ出力の消し忘れ防止
dbg_macro = "warn"
todo = "warn"

[profile.release]
# バイナリサイズと実行時効率を優先する設定
lto = true
codegen-units = 1
strip = true
